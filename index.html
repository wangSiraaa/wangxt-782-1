<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>政务绿色通道材料受理系统</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-logo">
        <span class="app-logo-icon">🏛️</span>
        <span class="app-logo-title">政务绿色通道材料受理系统</span>
      </div>
      <nav class="app-nav">
        <button class="nav-btn active" data-page="acceptance">窗口受理</button>
        <button class="nav-btn" data-page="admin">事项管理</button>
        <button class="nav-btn" data-page="preview">群众预审</button>
      </nav>
    </header>

    <main class="app-main">
      <aside class="sidebar" id="itemListContainer"></aside>
      
      <div class="main-content">
        <div class="content-center">
          <div class="applicant-form">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">申请人姓名</label>
                <input type="text" class="form-input" id="applicantName" placeholder="请输入申请人姓名">
              </div>
              <div class="form-group">
                <label class="form-label">身份证号</label>
                <input type="text" class="form-input" id="applicantId" placeholder="请输入身份证号">
              </div>
              <div class="form-group">
                <label class="form-label">联系电话</label>
                <input type="text" class="form-input" id="applicantPhone" placeholder="请输入联系电话">
              </div>
            </div>
          </div>
          
          <div id="materialListContainer"></div>
          
          <div class="action-bar">
            <button class="btn btn-secondary" id="btnReset">重置</button>
            <button class="btn btn-secondary" id="btnSave">暂存</button>
            <button class="btn btn-primary" id="btnAccept" disabled>受理</button>
          </div>
        </div>
        
        <div class="content-right">
          <div id="acceptanceInfoContainer"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/utils/uuid.js"></script>
  <script src="js/utils/date.js"></script>
  <script src="js/utils/validator.js"></script>
  <script src="js/models/Priority.js"></script>
  <script src="js/models/Item.js"></script>
  <script src="js/models/Material.js"></script>
  <script src="js/models/Application.js"></script>
  <script src="js/services/StorageService.js"></script>
  <script src="js/services/AcceptanceService.js"></script>
  <script src="js/services/CountdownService.js"></script>
  <script src="js/services/DuplicateCheckService.js"></script>
  <script src="js/components/Modal.js"></script>
  <script src="js/components/ItemList.js"></script>
  <script src="js/components/MaterialList.js"></script>
  <script src="js/components/AcceptanceInfo.js"></script>
  <script src="js/pages/index.js"></script>
</body>
</html>
