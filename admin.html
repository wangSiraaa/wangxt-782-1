<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事项管理 - 政务绿色通道材料受理系统</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-logo">
        <span class="app-logo-icon">🏛️</span>
        <span class="app-logo-title">政务绿色通道材料受理系统 - 事项管理</span>
      </div>
      <nav class="app-nav">
        <button class="nav-btn" data-page="acceptance">窗口受理</button>
        <button class="nav-btn active" data-page="admin">事项管理</button>
        <button class="nav-btn" data-page="preview">群众预审</button>
      </nav>
    </header>

    <main class="app-main">
      <div class="admin-panel">
        <div class="admin-tabs">
          <div class="admin-tab active" data-tab="items">事项类型</div>
          <div class="admin-tab" data-tab="materials">材料配置</div>
          <div class="admin-tab" data-tab="applications">申请记录</div>
          <div class="admin-tab" data-tab="data">数据管理</div>
        </div>
        
        <div class="admin-content">
          <div id="tab-content"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/utils/uuid.js"></script>
  <script src="js/utils/date.js"></script>
  <script src="js/utils/validator.js"></script>
  <script src="js/models/Priority.js"></script>
  <script src="js/models/Item.js"></script>
  <script src="js/models/Material.js"></script>
  <script src="js/models/Application.js"></script>
  <script src="js/services/StorageService.js"></script>
  <script src="js/services/AcceptanceService.js"></script>
  <script src="js/services/CountdownService.js"></script>
  <script src="js/services/DuplicateCheckService.js"></script>
  <script src="js/components/Modal.js"></script>
  <script src="js/pages/admin.js"></script>
</body>
</html>
